<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting, please wait...</p>
  <script>
    (function () {
      const hash = window.location.hash;
      if (hash && hash.includes("access_token")) {
        const query = hash.substring(1);
        window.location.replace("/?" + query);
      } else {
        window.location.replace("/");
      }
    })();
  </script>
</body>
</html>
