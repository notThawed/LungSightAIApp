<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LungSight - Redirecting</title>
</head>

<body>

    <p>Redirecting to LungSight...</p>

    <script>
        (function () {

            const hash = window.location.hash;

            if (!hash) {
                window.location.replace("/");
                return;
            }

            const params = new URLSearchParams(
                hash.substring(1)
            );

            const accessToken =
                params.get("access_token");

            const refreshToken =
                params.get("refresh_token");

            const type =
                params.get("type");

            if (
                accessToken &&
                refreshToken
            ) {

                const query =
                    new URLSearchParams({
                        access_token: accessToken,
                        refresh_token: refreshToken,
                        ...(type
                            ? { type: type }
                            : {}
                        )
                    });

                window.location.replace(
                    "/?" + query.toString()
                );

                return;
            }

            window.location.replace("/");

        })();
    </script>

</body>
</html>
